<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .container{
            width:100%;
            max-width:550px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:25px;
            font-size:15px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:6px;
            font-weight:bold;
            color:#444;
        }

        input, select{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:15px;
        }

        input:focus, select:focus{
            outline:none;
            border-color:#667eea;
        }

        .btn{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#667eea;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#5a67d8;
        }

        .result{
            margin-top:25px;
            padding:18px;
            background:#eef2ff;
            border-radius:12px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:#333;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student Exam Performance</h1>

        <p class="subtitle">
            Predict Maths Score using Machine Learning
        </p>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <label>Gender</label>
            <select name="gender" required>
                <option selected disabled value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Race or Ethnicity</label>
            <select name="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label>Parental Level of Education</label>
            <select name="parental_level_of_education" required>
                <option selected disabled value="">Select Education</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="high school">High School</option>
                <option value="master's degree">Master's Degree</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
            </select>

            <label>Lunch Type</label>
            <select name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free/Reduced</option>
            </select>

            <label>Test Preparation Course</label>
            <select name="test_preparation_course" required>
                <option selected disabled value="">Select Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label>Reading Score</label>
            <input type="number"
                   name="reading_score"
                   placeholder="Enter Reading Score"
                   min="0"
                   max="100"
                   required>

            <label>Writing Score</label>
            <input type="number"
                   name="writing_score"
                   placeholder="Enter Writing Score"
                   min="0"
                   max="100"
                   required>

            <button class="btn" type="submit">
                Predict Maths Score
            </button>

        </form>

        {% if results %}
        <div class="result">
            Predicted Maths Score: {{ results }}
        </div>
        {% endif %}

    </div>

</body>
</html>
